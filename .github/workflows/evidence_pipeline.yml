name: Daily Cardiology Evidence Pipeline

on:
  schedule:
    - cron: '13 0 * * *'
    - cron: '47 0 * * *'
    - cron: '26 1 * * *'
    - cron: '8 2 * * *'
  workflow_run:
    workflows: [Daily 06:00 AM Cardiology Pillar Refresh]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if today's UTC snapshot is already on main
        type: boolean
        default: false
  pull_request:
    paths:
      - 'pipeline/**'
      - '.github/workflows/evidence_pipeline.yml'
      - '.github/workflows/pages.yml'
      - 'evidence_feed.js'
      - 'offline.js'
      - 'index.html'
      - 'fetch_daily_ebm.py'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - '.github/workflows/evidence_pipeline.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.force != true) && 'evidence-automatic' || format('evidence-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run: ${{ steps.snapshot.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || '' }}
          persist-credentials: false
      - name: Check for today's UTC snapshot
        id: snapshot
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          today=$(date -u +%F)
          echo "date=$today" >> "$GITHUB_OUTPUT"
          if [[ "$FORCE" != true && "$EVENT" != pull_request &&
                -s data/pipeline/briefing.json && -s data/pipeline/evidence.parquet ]] &&
             jq -e --arg date "$today" '.date == $date' data/pipeline/briefing.json >/dev/null; then
            echo "Today's UTC snapshot ($today) is already on main."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.snapshot.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install pinned pipeline dependencies
        if: steps.snapshot.outputs.run == 'true'
        run: python -m pip install -r pipeline/requirements.txt
      - name: Run repository tests
        if: github.event_name == 'pull_request'
        run: |
          python -m unittest discover tests
          for test in tests/*.js; do node "$test"; done
      - name: Ingest sources, run dbt build, and validate the briefing contract
        if: steps.snapshot.outputs.run == 'true'
        env:
          SNAPSHOT_DATE: ${{ steps.snapshot.outputs.date }}
        run: python -m pipeline.run --date "$SNAPSHOT_DATE" --work-dir "$RUNNER_TEMP/heart-evidence"
      - uses: actions/upload-artifact@v4
        if: steps.snapshot.outputs.run == 'true'
        with:
          name: evidence-snapshot
          retention-days: 14
          path: |
            ${{ runner.temp }}/heart-evidence/raw/
            ${{ runner.temp }}/heart-evidence/bronze/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.snapshot.outputs.run == 'true'
        with:
          name: evidence-public
          retention-days: 7
          path: ${{ runner.temp }}/heart-evidence/publish/
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.run == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: evidence-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: evidence-public
          path: ${{ runner.temp }}/evidence-public
      - name: Commit validated JSON and Parquet
        env:
          SNAPSHOT: ${{ runner.temp }}/evidence-public
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          mkdir -p data/pipeline
          if [[ -f data/pipeline/briefing.json ]]; then
            current=$(jq -r '.date | strings | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' data/pipeline/briefing.json) || current=
            candidate=$(jq -er '.date' "$SNAPSHOT/briefing.json")
            if [[ "$candidate" < "$current" ]]; then
              echo "A newer snapshot is already published."
              exit 0
            fi
            if [[ "$FORCE" != true && "$candidate" == "$current" && -s data/pipeline/evidence.parquet ]]; then
              echo "This UTC snapshot date is already published."
              exit 0
            fi
          fi
          cp "$SNAPSHOT/briefing.json" "$SNAPSHOT/evidence.parquet" data/pipeline/
          git add data/pipeline/briefing.json data/pipeline/evidence.parquet
          if git diff --staged --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(data): publish cardiology evidence $(jq -er '.date' data/pipeline/briefing.json)"
          for attempt in 1 2 3; do
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
