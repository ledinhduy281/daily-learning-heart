name: Deploy Daily Learning Heart to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Daily 06:00 AM Cardiology Pillar Refresh
      - Daily Cardiology Evidence Pipeline
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Stage public site assets only
        run: |
          mkdir -p site/data
          cp index.html icon.svg manifest.json clinical_distractors.js clinical_mcq.js \
            device_profile.js search_ranking.js evidence_feed.js offline.js site/
          cp data/briefings.js site/data/
          if [[ -f data/pipeline/briefing.json && -f data/pipeline/evidence.parquet ]]; then
            mkdir site/data/pipeline
            cp data/pipeline/briefing.json data/pipeline/evidence.parquet site/data/pipeline/
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
