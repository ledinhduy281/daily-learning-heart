name: Daily 06:00 AM Cardiology Pillar Refresh

on:
  schedule:
    # Off-minute UTC crons avoid top-of-hour (:00) GitHub Actions queue drops.
    # 22:53 UTC = 05:53 AM Asia/Ho_Chi_Minh (generates & deploys by ~06:00 AM VN)
    # 23:17 UTC & 23:43 UTC = 06:17 AM & 06:43 AM VN safety catch-up retries (idempotent)
    - cron: '53 22 * * *'
    - cron: '17 23 * * *'
    - cron: '43 23 * * *'
  workflow_dispatch:
    inputs:
      regenerate_quiz_sets:
        description: 'Rebuild today’s clinical quiz sets instead of reusing valid sets'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/daily_refresh.yml']

permissions:
  contents: write

concurrency:
  group: daily-pillar-refresh
  cancel-in-progress: false

jobs:
  refresh-daily-pillar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || '' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build today's single pillar lesson
        env:
          TZ: Asia/Ho_Chi_Minh
        run: |
          python3 fetch_daily_ebm.py --refresh-if-needed

      - name: Validate lesson before publishing
        env:
          TZ: Asia/Ho_Chi_Minh
        run: |
          if ! git diff --quiet HEAD -- data/briefings.js data/rotation_state.json; then
            python3 -m pipeline.validate_lesson --date "$(date +%F)" --rotation-state data/rotation_state.json
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate checked AI quiz sets for today's lesson
        timeout-minutes: 15
        continue-on-error: true
        env:
          TZ: Asia/Ho_Chi_Minh
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          REGENERATE_QUIZ_SETS: ${{ inputs.regenerate_quiz_sets }}
        run: |
          node generate_quiz_sets.js

      - name: Commit and push updated briefings.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefings.js data/rotation_state.json data/quiz_sets.js
          if git diff --staged --quiet; then
            echo "No briefing changes to commit."
          else
            git commit -m "chore(daily): refresh single pillar briefing ($(TZ=Asia/Ho_Chi_Minh date +%F))"
            git pull --rebase origin main
            git push
          fi
