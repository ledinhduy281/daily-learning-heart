name: Daily 06:00 AM Cardiology Pillar Refresh

on:
  schedule:
    # Off-minute UTC crons avoid top-of-hour (:00) GitHub Actions queue drops.
    # 22:53 UTC = 05:53 AM Asia/Ho_Chi_Minh (generates & deploys by ~06:00 AM VN)
    # 23:17 UTC & 23:43 UTC = 06:17 AM & 06:43 AM VN safety catch-up retries (idempotent)
    - cron: '53 22 * * *'
    - cron: '17 23 * * *'
    - cron: '43 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-pillar-refresh
  cancel-in-progress: false

jobs:
  refresh-daily-pillar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore the latest approved lesson archive
        run: |
          bash pipeline/select_approved_lessons.sh "$RUNNER_TEMP/approved-lessons"
          cp "$RUNNER_TEMP/approved-lessons/"* data/

      - name: Build today's single pillar lesson
        env:
          TZ: Asia/Ho_Chi_Minh
        run: |
          python3 fetch_daily_ebm.py --refresh-if-needed

      - name: Validate lesson before publishing
        env:
          TZ: Asia/Ho_Chi_Minh
        run: |
          previous="$RUNNER_TEMP/approved-lessons/briefings.js"
          if ! cmp -s "$previous" data/briefings.js; then
            python3 -m pipeline.validate_lesson --previous "$previous" --date "$(date +%F)"
          fi

      - name: Commit and push updated briefings.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefings.js data/rotation_state.json
          if git diff --staged --quiet; then
            echo "No briefing changes to commit."
          else
            git commit -m "chore(daily): refresh single pillar briefing ($(TZ=Asia/Ho_Chi_Minh date +%F))"
            git pull --rebase origin main || true
            git push
          fi
